<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14181e" />
    <meta name="description" content="Beltwise: build a factory on a frozen planet and terraform it back to life. Runs offline, touch-first." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Beltwise" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Beltwise</title>
    <!-- Every URL is relative so the build works from any GitHub Pages sub-path. -->
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
      :root {
        --bg: #14181e;
        --card: rgba(20, 24, 31, 0.88);
        --card-solid: #181c24;
        --line: rgba(255, 255, 255, 0.09);
        --text: #e6eaf0;
        --muted: #8b95a3;
        --accent: #fbbf24;
        --good: #4ade80;
        --bad: #f87171;
        --safe-b: env(safe-area-inset-bottom, 0px);
        --safe-t: env(safe-area-inset-top, 0px);
        --safe-l: env(safe-area-inset-left, 0px);
        --safe-r: env(safe-area-inset-right, 0px);
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.35 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      button { font: inherit; color: inherit; }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
      }
      .icon { display: inline-block; vertical-align: middle; flex: none; }
      .label { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
      .label b { color: var(--accent); }
      .bar { height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
      .bar i { display: block; height: 100%; width: 0; background: var(--good); transition: width 0.3s; }
      [hidden] { display: none !important; }

      /* ---- Top ---- */
      #top {
        position: fixed;
        top: calc(8px + var(--safe-t));
        left: calc(8px + var(--safe-l));
        right: calc(8px + var(--safe-r));
        display: flex;
        gap: 8px;
        align-items: flex-start;
        pointer-events: none;
      }
      #top > * { pointer-events: auto; }
      #objective { flex: 1 1 auto; min-width: 0; max-width: 360px; display: flex; gap: 10px; padding: 8px 10px; align-items: center; }
      #obj-icon { width: 36px; height: 36px; }
      .obj-main { min-width: 0; flex: 1; }
      #obj-text { font-weight: 650; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #objective .bar { margin: 5px 0 3px; }
      .obj-foot { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
      #obj-reward { display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; }
      #obj-reward .icon { width: 15px; height: 15px; }
      #planet { flex: none; width: 128px; padding: 8px 10px; cursor: pointer; text-align: right; }
      #planet .ti { font-size: 19px; font-weight: 750; font-variant-numeric: tabular-nums; line-height: 1.15; }
      #planet .ti small { font-size: 11px; color: var(--muted); font-weight: 500; }
      #ti-rate { font-size: 11px; color: var(--good); margin-bottom: 4px; font-variant-numeric: tabular-nums; }
      #stage-name { color: #86efac; }
      #perf { position: fixed; z-index: 3; left: calc(8px + var(--safe-l)); top: calc(92px + var(--safe-t)); padding: 6px 9px; font: 10.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); white-space: pre; pointer-events: none; }
      #actions { display: flex; flex-direction: column; gap: 8px; }
      .round {
        position: relative;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--card);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        display: grid;
        place-items: center;
        cursor: pointer;
        padding: 0;
        color: #cbd5e1;
        touch-action: manipulation;
      }
      .round svg { width: 22px; height: 22px; fill: currentColor; }
      .round:disabled { opacity: 0.35; }
      .badge {
        position: absolute;
        top: -4px;
        right: -4px;
        min-width: 19px;
        height: 19px;
        padding: 0 5px;
        border-radius: 10px;
        background: var(--accent);
        color: #1a1204;
        font-size: 11px;
        font-weight: 800;
        display: grid;
        place-items: center;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse { 50% { transform: scale(1.15); } }

      /* ---- Toast ---- */
      #toast {
        position: fixed;
        left: 50%;
        top: calc(96px + var(--safe-t));
        transform: translate(-50%, -8px);
        max-width: min(520px, calc(100vw - 24px));
        padding: 9px 16px;
        border-radius: 14px;
        background: rgba(18, 22, 28, 0.95);
        border: 1px solid var(--line);
        opacity: 0;
        transition: opacity 0.2s, transform 0.2s;
        pointer-events: none;
        text-align: center;
        z-index: 5;
      }
      #toast.show { opacity: 1; transform: translate(-50%, 0); }
      #toast .icon { width: 18px; height: 18px; margin: -3px 1px 0; }
      #toast.good { border-color: rgba(74, 222, 128, 0.6); }
      #toast.bad { border-color: rgba(248, 113, 113, 0.7); }
      #toast.epic { border-color: var(--accent); box-shadow: 0 0 40px rgba(251, 191, 36, 0.35); font-size: 15px; }

      /* ---- Build bar ---- */
      #buildbar {
        position: fixed;
        left: 50%;
        bottom: calc(8px + var(--safe-b));
        transform: translateX(-50%);
        width: min(760px, calc(100vw - 16px - var(--safe-l) - var(--safe-r)));
        padding: 5px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      #cats, #tools { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
      #cats::-webkit-scrollbar, #tools::-webkit-scrollbar { display: none; }
      .cat {
        flex: 1 1 0;
        min-width: 44px;
        height: 38px;
        border: 1px solid transparent;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.03);
        color: var(--muted);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        cursor: pointer;
        padding: 0 6px;
        touch-action: manipulation;
      }
      .cat svg { width: 19px; height: 19px; fill: currentColor; flex: none; }
      .cat span { font-size: 11px; white-space: nowrap; }
      .cat.active { color: var(--text); background: color-mix(in srgb, var(--accent) 16%, transparent); border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
      .cat.danger.active { --accent: var(--bad); }
      .sep { flex: none; width: 1px; background: var(--line); margin: 6px 2px; }
      .tool {
        flex: none;
        width: 68px;
        height: 64px;
        border: 1px solid transparent;
        border-radius: 10px;
        background: transparent;
        color: var(--muted);
        font-size: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        cursor: pointer;
        touch-action: manipulation;
        padding: 2px;
      }
      .tool span { max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tool:hover { background: rgba(255, 255, 255, 0.05); }
      .tool.active { background: rgba(251, 191, 36, 0.14); border-color: rgba(251, 191, 36, 0.55); color: var(--text); }
      .locked-hint { flex: none; align-self: center; padding: 0 10px; color: var(--muted); font-size: 11px; white-space: nowrap; }
      #selection {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(126px + var(--safe-b));
        width: min(520px, calc(100vw - 120px));
        padding: 6px 10px;
        display: flex;
        align-items: center;
        gap: 8px;
        pointer-events: none;
      }
      .sel-main { flex: 1; min-width: 0; }
      .sel-main b { display: block; font-size: 13px; }
      .sel-main small { display: block; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sel-cost { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
      .chip { display: inline-flex; align-items: center; gap: 3px; padding: 2px 6px 2px 3px; border-radius: 8px; background: rgba(255, 255, 255, 0.06); font-size: 11.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .chip.short { color: var(--bad); background: rgba(248, 113, 113, 0.12); }
      .chip.free { color: var(--good); }
      .fab { position: fixed; bottom: calc(128px + var(--safe-b)); z-index: 2; width: 50px; height: 50px; }
      .fab svg { width: 26px; height: 26px; }
      #undo { left: calc(10px + var(--safe-l)); }
      #rotate { right: calc(10px + var(--safe-r)); }
      #rotate svg { width: 32px; height: 32px; }
      #rotate .dir { transform-box: view-box; transform-origin: 50px 50px; transition: transform 0.15s; }
      #rotate:disabled { opacity: 0; pointer-events: none; }

      /* ---- Sheets ---- */
      #sheet-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.35); z-index: 9; }
      #sheet {
        position: fixed;
        z-index: 10;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(8px + var(--safe-b));
        width: min(520px, calc(100vw - 16px));
        max-height: min(78vh, 720px);
        display: flex;
        flex-direction: column;
        background: var(--card-solid);
        -webkit-user-select: text;
        user-select: text;
      }
      #sheet.compact { max-height: 44vh; bottom: calc(128px + var(--safe-b)); }
      #sheet > header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 6px 16px; border-bottom: 1px solid var(--line); }
      #sheet h2 { margin: 0; font-size: 16px; }
      #sheet-close { width: 36px; height: 36px; border: 0; border-radius: 10px; background: rgba(255, 255, 255, 0.06); font-size: 20px; cursor: pointer; }
      #sheet-body { overflow-y: auto; padding: 10px 14px 14px; -webkit-overflow-scrolling: touch; }
      #sheet-body h3 { margin: 14px 0 6px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
      #sheet-body h3 small { color: var(--accent); }
      .hint { color: var(--muted); font-size: 12.5px; margin: 6px 0 10px; }
      .btn { border: 1px solid var(--line); background: rgba(255, 255, 255, 0.06); border-radius: 10px; padding: 8px 12px; cursor: pointer; touch-action: manipulation; }
      .btn.primary { background: var(--accent); color: #1a1204; border-color: transparent; font-weight: 700; }
      .btn:disabled { opacity: 0.45; cursor: default; }
      .btn[data-danger] { color: var(--bad); }
      .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
      .field { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 8px 0 4px; }
      .field > span { color: var(--text); font-size: 13px; }
      .seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex: 0 1 260px; }
      .seg button { flex: 1; padding: 7px 4px; border: 0; background: transparent; cursor: pointer; font-size: 12.5px; touch-action: manipulation; }
      .seg button + button { border-left: 1px solid var(--line); }
      .seg button.on { background: var(--accent); color: #1a1204; font-weight: 700; }
      .tech-list { display: flex; flex-direction: column; gap: 8px; }
      .tech { border: 1px solid var(--line); border-radius: 12px; padding: 9px 10px; background: rgba(255, 255, 255, 0.02); }
      .tech.ready { border-color: rgba(251, 191, 36, 0.6); box-shadow: inset 0 0 0 1px rgba(251, 191, 36, 0.15); }
      .tech.locked { opacity: 0.55; }
      .tech-head { display: flex; gap: 8px; align-items: center; }
      .tech-head b { display: block; }
      .tech-head small { color: var(--muted); font-size: 12px; }
      .tech-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; }
      .chips { display: flex; flex-wrap: wrap; gap: 4px; }
      .why { color: var(--muted); font-size: 11.5px; text-align: right; }
      .done-list { display: flex; flex-wrap: wrap; gap: 6px; }
      .tech.done { display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; font-size: 12px; border-color: rgba(74, 222, 128, 0.35); }
      .ti-big { font-size: 15px; margin: 4px 0; }
      .ti-big b { font-size: 30px; }
      .ti-big small { color: var(--muted); display: block; font-size: 12px; }
      .meter { margin: 10px 0; }
      .meter-head { display: flex; justify-content: space-between; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
      .meter-head small { color: var(--good); }
      .stages { list-style: none; margin: 0; padding: 0; }
      .stages li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 10px; border-radius: 10px; opacity: 0.6; }
      .stages li small { display: block; color: var(--muted); font-size: 12px; }
      .stages li span { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; text-align: right; }
      .stages li span em { display: block; font-style: normal; font-size: 11px; color: var(--accent); }
      .stages li.reached { opacity: 0.85; }
      .stages li.reached b::after { content: ' ✓'; color: var(--good); }
      .stages li.current { opacity: 1; background: rgba(74, 222, 128, 0.1); border: 1px solid rgba(74, 222, 128, 0.35); }
      .storage { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
      .cell { border: 1px solid var(--line); border-radius: 10px; padding: 8px 6px; text-align: center; background: rgba(255, 255, 255, 0.02); }
      .cell b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
      .cell small { color: var(--muted); font-size: 11px; }
      .stack { display: inline-flex; align-items: center; gap: 3px; margin-right: 6px; font-variant-numeric: tabular-nums; }
      .recipe { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
      .recipe .arrow { color: var(--muted); margin: 0 6px; }
      .recipe small { color: var(--muted); margin-left: auto; }
      .inspect-head { display: flex; gap: 10px; align-items: center; margin-bottom: 4px; }
      .inspect-head b { display: block; font-size: 15px; }
      .status { font-size: 12px; color: var(--muted); }
      .status.s1 { color: var(--good); }
      .status.s2 { color: var(--accent); }
      .status.s3 { color: var(--bad); }
      .inspect .bar { margin: 8px 0; }
      .bench table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
      .bench th, .bench td { padding: 5px 4px; border-bottom: 1px solid var(--line); text-align: right; }
      .bench th:first-child, .bench td:first-child { text-align: left; }
      .help ol { padding-left: 20px; }
      .help li { margin: 6px 0; }
      .about { color: var(--muted); font-size: 11px; margin-top: 16px; }
      #fatal { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; background: var(--bg); text-align: center; color: #fca5a5; z-index: 20; }
      body.benchmarking #buildbar, body.benchmarking #top, body.benchmarking .fab, body.benchmarking #selection { display: none; }


      /* ---- v2 additions ---- */
      #power { display: flex; align-items: center; justify-content: flex-end; gap: 3px; margin-top: 5px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
      #power svg { width: 12px; height: 12px; fill: #facc15; flex: none; }
      #power.short { color: var(--bad); }
      #power.short svg { fill: var(--bad); animation: pulse 1s ease-in-out infinite; }
      #shower { margin-top: 4px; font-size: 11px; font-weight: 700; color: #f0abfc; animation: pulse 1.2s ease-in-out infinite; }
      .badge.dot { min-width: 12px; height: 12px; padding: 0; top: -2px; right: -2px; }
      #overlay { left: calc(10px + var(--safe-l)); bottom: calc(186px + var(--safe-b)); }
      #overlay.on { color: #1a1204; background: #facc15; border-color: transparent; }
      #selrect { position: fixed; left: 0; top: 0; border: 2px dashed #38bdf8; background: rgba(56, 189, 248, 0.12); border-radius: 4px; pointer-events: none; z-index: 1; transform-origin: 0 0; }
      #selection.interactive { pointer-events: auto; flex-wrap: wrap; }
      .sel-opts, .opts { display: flex; flex-wrap: wrap; gap: 4px; width: 100%; }
      .opts { margin: 6px 0; }
      .opt { display: inline-flex; align-items: center; gap: 4px; min-height: 32px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 9px; background: rgba(255, 255, 255, 0.04); cursor: pointer; font-size: 12px; touch-action: manipulation; }
      .opt.on { border-color: var(--accent); background: rgba(251, 191, 36, 0.16); color: var(--text); }
      .opt.alt { border-style: dashed; }
      .opt span { max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .chip.power { color: #facc15; }
      .chip.power svg { width: 11px; height: 11px; fill: currentColor; }
      .status.s4, .status.s5 { color: var(--bad); }
      .status.s6 { color: var(--muted); }
      .warn { color: var(--bad); font-size: 12.5px; margin: 6px 0; display: flex; gap: 6px; align-items: center; }
      .warn svg, .power-line svg { width: 13px; height: 13px; fill: currentColor; flex: none; }
      .power-line { display: flex; gap: 6px; align-items: center; }
      .clock { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 13px; }
      .clock > span { display: inline-flex; gap: 4px; align-items: center; min-width: 110px; }
      .clock b { min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; }
      .clock small { color: var(--muted); font-size: 11.5px; }
      .btn.small { padding: 4px 10px; min-width: 34px; }
      .tabs { margin: 2px 0 10px; flex: none; width: 100%; }
      table.stats { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
      table.stats th, table.stats td { padding: 5px 4px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
      table.stats th:first-child, table.stats td:first-child { text-align: left; }
      table.stats td .icon { margin-right: 4px; }
      td.pos { color: var(--good); }
      td.neg { color: var(--bad); }
      h3.tier { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
      h3.tier .lock { font-size: 10.5px; letter-spacing: 0; text-transform: none; color: #f0abfc; }
      h3.tier.locked { opacity: 0.6; }
      .lvl { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: rgba(251, 191, 36, 0.15); color: var(--accent); font-weight: 800; flex: none; }
      .ark-card { border: 1px solid rgba(240, 171, 252, 0.45); border-radius: 14px; padding: 12px; background: linear-gradient(160deg, rgba(168, 85, 247, 0.12), rgba(255, 255, 255, 0.02)); }
      .ark-card.done { border-color: rgba(74, 222, 128, 0.5); background: linear-gradient(160deg, rgba(74, 222, 128, 0.12), rgba(255, 255, 255, 0.02)); }
      .ark-title b { display: block; font-size: 18px; margin: 2px 0; }
      .ark-title small { color: var(--muted); font-size: 12.5px; }
      .ark-row { display: flex; gap: 10px; align-items: center; margin: 10px 0; }
      .ark-main { flex: 1; min-width: 0; }
      .ark-head { display: flex; justify-content: space-between; font-size: 13px; font-variant-numeric: tabular-nums; margin-bottom: 4px; }
      .ark-main small { color: var(--muted); font-size: 11px; }
      .ark-main .bar i { background: #e879f9; }
      .planet-card { border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin: 8px 0; display: flex; flex-direction: column; gap: 6px; }
      .planet-card small { color: var(--muted); }
      .planet-card.locked { opacity: 0.55; }
      .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
      .grid2 .btn { text-align: left; display: flex; justify-content: space-between; align-items: center; }
      .grid2 small { color: var(--muted); }
      .grid2 small.hot { color: #1a1204; background: var(--accent); border-radius: 8px; padding: 0 6px; font-weight: 800; }
      .shop-card, .ach, .bp, .alt-card { border: 1px solid var(--line); border-radius: 12px; padding: 9px 10px; margin: 8px 0; background: rgba(255, 255, 255, 0.02); }
      .shop-card { display: flex; gap: 10px; align-items: center; }
      .shop-card > div { flex: 1; min-width: 0; }
      .shop-card small, .ach small, .bp small, .alt-card small { display: block; color: var(--muted); font-size: 12px; }
      .swatch { width: 36px; height: 36px; border-radius: 10px; flex: none; border: 2px solid rgba(255, 255, 255, 0.15); background: #525a66; }
      .swatch.c1 { background: repeating-linear-gradient(135deg, #f59e0b 0 6px, #3a414b 6px 12px); }
      .swatch.c2 { background: repeating-linear-gradient(135deg, #2dd4bf 0 6px, #3a414b 6px 12px); }
      .swatch.c3 { background: repeating-linear-gradient(135deg, #a78bfa 0 6px, #3a414b 6px 12px); }
      .swatch.c4 { background: repeating-linear-gradient(135deg, #f43f5e 0 6px, #3a414b 6px 12px); }
      .swatch.c8 { background: radial-gradient(circle, #fde68a, #b45309); }
      .swatch.c9 { background: radial-gradient(circle, #f8fafc, #64748b); }
      .swatch.c10 { background: conic-gradient(#f472b6, #60a5fa, #34d399, #fbbf24, #f472b6); }
      .ach { display: flex; justify-content: space-between; gap: 10px; align-items: center; opacity: 0.55; }
      .ach.done { opacity: 1; border-color: rgba(251, 191, 36, 0.45); }
      .ach span { color: var(--accent); font-size: 11.5px; white-space: nowrap; }
      .log { border-left: 3px solid #f0abfc; padding: 4px 12px; margin: 12px 0; }
      .log p { margin: 4px 0 0; color: #d6dbe3; font-style: italic; line-height: 1.5; }
      .log.big p { font-size: 15px; }
      .loot { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; font-size: 15px; }
      .alt-head { display: flex; gap: 8px; align-items: center; }
      .alt-card .btn { margin-top: 4px; }
      .bp .row { margin: 6px 0 0; }

      /* ---- Title screen ---- */
      #title { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at center, rgba(10, 14, 20, 0.25), rgba(10, 14, 20, 0.85)); transition: opacity 0.45s; }
      #title.out { opacity: 0; pointer-events: none; }
      .title-inner { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
      .title-mark { width: min(44vw, 180px); height: auto; border-radius: 22%; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.06); animation: float 6s ease-in-out infinite; }
      #title h1 { margin: 4px 0 0; line-height: 0; }
      .title-word { width: min(78vw, 380px); height: auto; filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.5)); }
      .tagline { margin: 0 0 10px; color: #cbd5e1; font-size: 15px; }
      .btn.big { font-size: 17px; padding: 12px 42px; border-radius: 14px; }
      .btn.ghost { background: transparent; border-color: rgba(255, 255, 255, 0.2); }
      @keyframes float { 50% { transform: translateY(-8px) rotate(-2deg); } }
      body.title #top, body.title #buildbar, body.title .fab, body.title #selection, body.title #perf { opacity: 0; pointer-events: none; }

      /* ---- Launch cinematic ---- */
      #launch { position: fixed; inset: 0; z-index: 25; pointer-events: none; opacity: 0; transition: opacity 0.4s; }
      body.launching #launch { opacity: 1; }
      body.launching #top, body.launching #buildbar, body.launching .fab, body.launching #selection, body.launching #perf { opacity: 0; }
      #launch-rocket { --t: 0; position: absolute; left: 50%; top: 50%; width: 26px; height: 70px; margin: -35px 0 0 -13px; transform: translateY(calc(var(--t) * var(--t) * -120vh)); }
      #launch-rocket::before { content: ''; position: absolute; inset: 0; border-radius: 50% 50% 8px 8px; background: linear-gradient(90deg, #cbd5e1, #f8fafc 45%, #94a3b8); box-shadow: 0 0 0 2px #0b1016; }
      #launch-rocket i { position: absolute; left: 3px; right: 3px; top: 64px; height: calc(40px + var(--t) * 160px); border-radius: 50%; background: radial-gradient(ellipse at top, #fff7ed, #fb923c 40%, rgba(239, 68, 68, 0) 70%); filter: blur(1px); }
      body.launching::after { content: ''; position: fixed; inset: 0; background: #fff; opacity: 0; animation: flashout 4.2s ease-in forwards; pointer-events: none; z-index: 26; }
      @keyframes flashout { 85% { opacity: 0; } 97% { opacity: 1; } 100% { opacity: 1; } }

      @media (max-width: 900px) {
        .cat span { display: none; }
      }
      @media (max-width: 480px) {
        #overlay { bottom: calc(178px + var(--safe-b)); }
        .tool { width: 60px; height: 58px; }
        #planet { width: 112px; }
        #selection { width: calc(100vw - 132px); bottom: calc(120px + var(--safe-b)); }
        .fab { bottom: calc(120px + var(--safe-b)); }
        #sheet.compact { bottom: calc(120px + var(--safe-b)); }
      }
      @media (hover: hover) { .round:hover, .cat:hover { color: var(--text); } }
    </style>
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <canvas id="game" aria-label="Planet surface"></canvas>

    <header id="top">
      <section id="objective" class="card" aria-label="Current objective">
        <img id="obj-icon" class="icon" alt="" />
        <div class="obj-main">
          <div class="label">Objective <b id="obj-num">1</b></div>
          <div id="obj-text"></div>
          <div class="bar"><i id="obj-bar"></i></div>
          <div class="obj-foot"><span id="obj-count"></span><span id="obj-reward"></span></div>
        </div>
      </section>
      <section id="planet" class="card" role="button" tabindex="0" aria-label="Planet status" title="Planet (P)">
        <div class="label" id="stage-name">Barren</div>
        <div class="ti"><span id="ti">0</span><small> Ti</small></div>
        <div id="ti-rate"></div>
        <div class="bar"><i id="stage-bar"></i></div>
        <div id="power" title="Power use / available"></div>
        <div id="shower" hidden></div>
      </section>
      <nav id="actions" aria-label="Game menu">
        <button id="btn-research" class="round" type="button" aria-label="Research" title="Research (T)"><span id="research-badge" class="badge" hidden></span></button>
        <button id="btn-ark" class="round" type="button" aria-label="The Ark" title="The Ark (K)"><span id="ark-badge" class="badge dot" hidden></span></button>
        <button id="btn-core" class="round" type="button" aria-label="Core storage and statistics" title="Core (C)"></button>
        <button id="btn-menu" class="round" type="button" aria-label="Menu" title="Menu"><span id="menu-badge" class="badge" hidden></span></button>
        <button id="btn-fullscreen" class="round" type="button" aria-label="Fullscreen" title="Fullscreen (F)"></button>
      </nav>
    </header>

    <div id="perf" class="card" hidden></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="selection" class="card" hidden></div>
    <div id="selrect" hidden></div>

    <footer id="buildbar" class="card" aria-label="Build">
      <div id="cats"></div>
      <div id="tools"></div>
    </footer>
    <button id="undo" class="round fab" type="button" aria-label="Undo" title="Undo (Z)" disabled></button>
    <button id="overlay" class="round fab" type="button" aria-label="Show power and problems" title="Power and problems (O)"></button>
    <button id="rotate" class="round fab" type="button" aria-label="Rotate" title="Rotate (R)" disabled></button>

    <div id="sheet-backdrop" hidden></div>
    <section id="sheet" class="card" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
      <header><h2 id="sheet-title"></h2><button id="sheet-close" type="button" aria-label="Close">×</button></header>
      <div id="sheet-body"></div>
    </section>

    <div id="title" hidden></div>
    <div id="launch" aria-hidden="true"><div id="launch-rocket"><i></i></div></div>
    <div id="fatal" role="alert" hidden></div>
    <noscript><div id="fatal">Beltwise needs JavaScript, WebAssembly and WebGL2.</div></noscript>
  </body>
</html>
